{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary">Employee Details Form</h6>
            </div>
            <div class="card-body">
                <form action="/predict" method="POST">
                    <h5 class="mb-3 text-gray-800 border-bottom pb-2">Professional Info</h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label"><i class="fas fa-building me-1"></i> Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="Sales & Marketing">Sales & Marketing</option>
                                <option value="Operations">Operations</option>
                                <option value="Technology">Technology</option>
                                <option value="Analytics">Analytics</option>
                                <option value="R&D">R&D</option>
                                <option value="Procurement">Procurement</option>
                                <option value="Finance">Finance</option>
                                <option value="HR">HR</option>
                                <option value="Legal">Legal</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="region" class="form-label"><i class="fas fa-map-marker-alt me-1"></i> Region</label>
                            <input type="text" class="form-control" id="region" name="region" placeholder="e.g. region_2" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="education" class="form-label"><i class="fas fa-user-graduate me-1"></i> Education</label>
                            <select class="form-select" id="education" name="education" required>
                                <option value="Bachelor's">Bachelor's</option>
                                <option value="Master's & above">Master's & above</option>
                                <option value="Below Secondary">Below Secondary</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="recruitment_channel" class="form-label"><i class="fas fa-handshake me-1"></i> Recruitment Channel</label>
                            <select class="form-select" id="recruitment_channel" name="recruitment_channel" required>
                                <option value="other">Other</option>
                                <option value="sourcing">Sourcing</option>
                                <option value="referred">Referred</option>
                            </select>
                        </div>
                    </div>

                    <h5 class="mb-3 mt-4 text-gray-800 border-bottom pb-2">Performance Metrics</h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="no_of_trainings" class="form-label">Trainings Completed</label>
                            <input type="number" class="form-control" id="no_of_trainings" name="no_of_trainings" min="1" max="10" value="1" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="previous_year_rating" class="form-label">Previous Rating (1-5)</label>
                            <input type="number" class="form-control" id="previous_year_rating" name="previous_year_rating" min="1" max="5" step="0.1" value="3.0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="avg_training_score" class="form-label">Avg Training Score</label>
                            <input type="number" class="form-control" id="avg_training_score" name="avg_training_score" min="0" max="100" value="50" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="KPIs_met_gt_80" class="form-label">KPIs > 80%?</label>
                            <select class="form-select" id="KPIs_met_gt_80" name="KPIs_met_gt_80" required>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="awards_won" class="form-label">Awards Won?</label>
                            <select class="form-select" id="awards_won" name="awards_won" required>
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>

                    <h5 class="mb-3 mt-4 text-gray-800 border-bottom pb-2">Personal Info</h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="age" class="form-label">Age</label>
                            <input type="number" class="form-control" id="age" name="age" min="18" max="60" value="30" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="m">Male</option>
                                <option value="f">Female</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="length_of_service" class="form-label">Service Years</label>
                            <input type="number" class="form-control" id="length_of_service" name="length_of_service" min="0" max="40" value="5" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary btn-lg shadow-sm">
                            <i class="fas fa-magic me-2"></i> Predict Segment
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
