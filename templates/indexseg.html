<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prédiction de Segmentation Employé</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .main-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        nav {
            background: #f8f9fa;
            padding: 15px 30px;
            border-bottom: 2px solid #e9ecef;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        nav a {
            color: #667eea;
            text-decoration: none;
            margin-right: 25px;
            font-weight: 600;
            transition: color 0.3s;
        }
        nav a:hover {
            color: #764ba2;
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        .form-control, .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 10px 15px;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-submit {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            transition: all 0.3s;
            width: 100%;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .section-title {
            color: #495057;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }
        .section-title i {
            margin-right: 10px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Navigation -->
        <nav>
            <a href="/"><i class="fas fa-home"></i> Accueil</a>
            <a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
        </nav>

        <!-- Formulaire -->
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="fas fa-users me-2"></i>Analyse de Segmentation Employé</h4>
                <small>Identifiez le segment de votre employé pour un management personnalisé</small>
            </div>
            <div class="card-body p-4">
                <form action="/predict_segmentation" method="POST">
                    
                    <!-- Informations Professionnelles -->
                    <h5 class="section-title">
                        <i class="fas fa-briefcase"></i>Informations Professionnelles
                    </h5>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label">Département</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="Sales & Marketing">Sales & Marketing</option>
                                <option value="Operations">Operations</option>
                                <option value="Technology">Technology</option>
                                <option value="Analytics">Analytics</option>
                                <option value="R&D">R&D</option>
                                <option value="Procurement">Procurement</option>
                                <option value="Finance">Finance</option>
                                <option value="HR">HR</option>
                                <option value="Legal">Legal</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="region" class="form-label">Région</label>
                            <input type="text" class="form-control" id="region" name="region" 
                                   placeholder="ex: region_2, region_15" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="education" class="form-label">Niveau d'Éducation</label>
                            <select class="form-select" id="education" name="education" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="Bachelor's">Bachelor's</option>
                                <option value="Master's & above">Master's & above</option>
                                <option value="Below Secondary">Below Secondary</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="recruitment_channel" class="form-label">Canal de Recrutement</label>
                            <select class="form-select" id="recruitment_channel" name="recruitment_channel" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="other">Autre</option>
                                <option value="sourcing">Sourcing</option>
                                <option value="referred">Référé</option>
                            </select>
                        </div>
                    </div>

                    <!-- Métriques de Performance -->
                    <h5 class="section-title">
                        <i class="fas fa-chart-line"></i>Métriques de Performance
                    </h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="no_of_trainings" class="form-label">Nombre de Formations</label>
                            <input type="number" class="form-control" id="no_of_trainings" name="no_of_trainings" 
                                   min="0" max="10" value="2" required>
                            <small class="text-muted">Formations complétées (0-10)</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="previous_year_rating" class="form-label">Évaluation Année N-1</label>
                            <input type="number" class="form-control" id="previous_year_rating" name="previous_year_rating" 
                                   min="1" max="5" step="0.1" value="3.0" required>
                            <small class="text-muted">Note de 1 à 5</small>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="avg_training_score" class="form-label">Score Moyen Formation</label>
                            <input type="number" class="form-control" id="avg_training_score" name="avg_training_score" 
                                   min="0" max="100" value="65" required>
                            <small class="text-muted">Score de 0 à 100</small>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="KPIs_met_gt_80" class="form-label">KPIs Atteints > 80%</label>
                            <select class="form-select" id="KPIs_met_gt_80" name="KPIs_met_gt_80" required>
                                <option value="0">Non</option>
                                <option value="1">Oui</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="awards_won" class="form-label">Prix Remportés</label>
                            <select class="form-select" id="awards_won" name="awards_won" required>
                                <option value="0">Non</option>
                                <option value="1">Oui</option>
                            </select>
                        </div>
                    </div>

                    <!-- Informations Personnelles -->
                    <h5 class="section-title">
                        <i class="fas fa-user"></i>Informations Personnelles
                    </h5>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="age" class="form-label">Âge</label>
                            <input type="number" class="form-control" id="age" name="age" 
                                   min="18" max="65" value="32" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="gender" class="form-label">Genre</label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="">-- Sélectionner --</option>
                                <option value="m">Homme</option>
                                <option value="f">Femme</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="length_of_service" class="form-label">Années de Service</label>
                            <input type="number" class="form-control" id="length_of_service" name="length_of_service" 
                                   min="0" max="40" value="5" required>
                        </div>
                    </div>

                    <!-- Bouton de soumission -->
                    <div class="mt-4">
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-magic me-2"></i>Analyser le Segment
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-white mt-4">
            <p><i class="fas fa-robot me-2"></i>Propulsé par Machine Learning & IA</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
